<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOS App - Hệ thống cứu hộ khẩn cấp</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/css/adminlte.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="style.css">
</head>

<body class="hold-transition sidebar-mini layout-fixed">

<!-- ============ LOGIN ============ -->
<div id="loginPage" class="login-page-custom">
  <div class="login-card">
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-bullhorn"></i></div>
      <h1><span style="color:#dc3545">SOS</span> App</h1>
      <p>Hệ thống cứu hộ khẩn cấp</p>
    </div>

    <!-- LOGIN -->
    <div id="loginForm">
      <h5 class="text-center mb-3" style="font-weight:700">Đăng nhập hệ thống</h5>

      <div class="form-group">
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-user"></i></span></div>
          <input type="text" id="loginUsername" class="form-control" placeholder="Tài khoản">
        </div>
      </div>

      <div class="form-group">
        <div class="input-group">
          <div class="input-group-prepend"><span class="input-group-text"><i class="fas fa-lock"></i></span></div>
          <input type="password" id="loginPassword" class="form-control" placeholder="Mật khẩu">
        </div>
      </div>

      <div class="form-group">
        <label class="small font-weight-bold">
          <i class="fas fa-shield-alt text-primary"></i> Xác minh không phải robot
        </label>
        <div class="captcha-box">
          <canvas id="captchaCanvas" width="160" height="50"></canvas>
          <button type="button" class="btn btn-sm btn-light ml-2" onclick="refreshCaptcha()">
            <i class="fas fa-sync-alt"></i>
          </button>
          <input type="text" id="captchaInput" class="form-control ml-2" placeholder="Mã" style="width:100px">
        </div>
      </div>

      <button class="btn btn-danger btn-block btn-lg" onclick="doLogin()">
        <i class="fas fa-sign-in-alt"></i> Đăng nhập
      </button>

      <div class="login-divider">hoặc</div>

      <button class="btn btn-outline-secondary btn-block" onclick="toggleAuth('register')">
        <i class="fas fa-user-plus"></i> Đăng ký tài khoản
      </button>

      <div id="loginMessage" class="mt-3"></div>
    </div>

    <!-- REGISTER -->
    <div id="registerForm" style="display:none">
      <h5 class="text-center mb-3" style="font-weight:700">Đăng ký tài khoản</h5>

      <div class="form-group">
        <input type="text" id="regName" class="form-control" placeholder="Họ và tên">
      </div>

      <div class="form-group">
        <input type="text" id="regUsername" class="form-control" placeholder="Tài khoản đăng nhập">
      </div>

      <div class="form-group">
        <input type="text" id="regPhone" class="form-control" placeholder="Số điện thoại">
      </div>

      <div class="form-group">
        <input type="password" id="regPassword" class="form-control" placeholder="Mật khẩu (≥ 6 ký tự)">
      </div>

      <div class="form-group">
        <input type="password" id="regConfirm" class="form-control" placeholder="Xác nhận mật khẩu">
      </div>

      <div class="form-group">
        <label class="small font-weight-bold">
          <i class="fas fa-shield-alt text-primary"></i> Xác minh không phải robot
        </label>
        <div class="captcha-box">
          <canvas id="captchaCanvas2" width="160" height="50"></canvas>
          <button type="button" class="btn btn-sm btn-light ml-2" onclick="refreshCaptcha2()">
            <i class="fas fa-sync-alt"></i>
          </button>
          <input type="text" id="captchaInput2" class="form-control ml-2" placeholder="Mã" style="width:100px">
        </div>
      </div>

      <div id="regMessage" class="mt-2"></div>

      <button class="btn btn-danger btn-block btn-lg" onclick="doRegister()">
        <i class="fas fa-user-plus"></i> Đăng ký
      </button>

      <button class="btn btn-outline-secondary btn-block mt-2" onclick="toggleAuth('login')">
        <i class="fas fa-arrow-left"></i> Quay lại
      </button>
    </div>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="appWrapper" class="wrapper" style="display:none">

  <nav class="main-header navbar navbar-expand navbar-dark">
    <ul class="navbar-nav">
      <li class="nav-item">
        <a class="nav-link" data-widget="pushmenu" href="#"><i class="fas fa-bars"></i></a>
      </li>
      <li class="nav-item d-none d-sm-inline-block">
        <a class="nav-link"><i class="fas fa-bullhorn text-danger"></i> SOS App</a>
      </li>
    </ul>

    <ul class="navbar-nav ml-auto">
      <li class="nav-item">
        <span class="nav-link"><i class="far fa-clock"></i> <span id="clockText"></span></span>
      </li>
      <li class="nav-item dropdown">
        <a class="nav-link" href="#" data-toggle="dropdown">
          <i class="far fa-user-circle"></i>
          <span id="userNameDisplay" class="ml-1">User</span>
        </a>
        <div class="dropdown-menu dropdown-menu-right">
          <a class="dropdown-item" onclick="showProfile()">
            <i class="fas fa-user-cog text-primary"></i> Thông tin cá nhân
          </a>
          <div class="dropdown-divider"></div>
          <a class="dropdown-item text-danger" onclick="doLogout()">
            <i class="fas fa-sign-out-alt"></i> Đăng xuất
          </a>
        </div>
      </li>
    </ul>
  </nav>

  <aside class="main-sidebar sidebar-dark-primary elevation-4">
    <a href="#" class="brand-link">
      <i class="fas fa-bullhorn brand-image ml-3 mr-2 text-danger"></i>
      <span class="brand-text font-weight-bold">SOS App</span>
    </a>

    <div class="sidebar">
      <div class="user-panel mt-3 pb-3 mb-3 d-flex">
        <div class="image">
          <div class="avatar-circle" id="sidebarAvatar">U</div>
        </div>
        <div class="info">
          <a href="#" class="d-block" id="sidebarName">Người dùng</a>
          <small class="text-muted" id="sidebarRole">—</small>
        </div>
      </div>

      <nav class="mt-2">
        <ul class="nav nav-pills nav-sidebar flex-column" id="sidebarMenu"></ul>
      </nav>
    </div>
  </aside>

  <div class="content-wrapper">
    <section class="content-header">
      <div class="container-fluid">
        <div class="row mb-2">
          <div class="col-sm-6"><h1 id="pageTitle">Dashboard</h1></div>
          <div class="col-sm-6">
            <ol class="breadcrumb float-sm-right">
              <li class="breadcrumb-item"><a href="#">Home</a></li>
              <li class="breadcrumb-item active" id="breadcrumb">Dashboard</li>
            </ol>
          </div>
        </div>
      </div>
    </section>

    <section class="content">
      <div class="container-fluid" id="pageContent"></div>
    </section>
  </div>

  <footer class="main-footer">
    <div class="float-right d-none d-sm-inline"><b>Version</b> 3.0</div>
    <strong>&copy; 2026 <span class="text-danger">SOS App</span></strong>
  </footer>
</div>

<!-- MODAL SOS -->
<div class="modal fade" id="sosModal">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header bg-danger">
        <h5 class="modal-title text-white"><i class="fas fa-info-circle"></i> Chi tiết SOS</h5>
        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body" id="sosModalBody"></div>
    </div>
  </div>
</div>

<!-- MODAL PROFILE -->
<div class="modal fade" id="profileModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary">
        <h5 class="modal-title text-white"><i class="fas fa-user-cog"></i> Thông tin cá nhân</h5>
        <button type="button" class="close text-white" data-dismiss="modal">&times;</button>
      </div>
      <div class="modal-body" id="profileModalBody"></div>
    </div>
  </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/admin-lte@3.2.0/dist/js/adminlte.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script src="db.js"></script>
<script src="captcha.js"></script>
<script src="app.js"></script>

</body>
</html>
